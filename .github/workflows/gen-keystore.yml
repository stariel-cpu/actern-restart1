name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and print base64
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias my-release-key \
            -storepass "${{ github.event.inputs.storepass || 'ChangeMeStorePass123!' }}" \
            -keypass "${{ github.event.inputs.keypass || 'ChangeMeKeyPass123!' }}" \
            -dname "CN=stariel, OU=Dev, O=stariel, L=Manila, S=NCR, C=PH"

          echo "=== SINGLE LINE BASE64 (COPY THIS) ==="
          base64 -w 0 release.jks
          echo ""
          echo "====================================="
          
